# CI for air-gestures.
#
# Every push: `test` runs the test suite; non-tag pushes also run `build`
# (a --release build, so a broken release build shows up before tagging).
#
# To publish a release, tag the commit and push the tag:
#
#   git tag v0.3.6 && git push origin v0.3.6
#
# On a v* tag, `package` and `package-aarch64` build the x86_64 and aarch64
# Linux binaries, pack air-gestures-<tag>-<arch>-linux.tar.gz, .deb and .rpm and
# upload them to the project's generic package registry; `package-arch` builds the
# AUR PKGBUILD from those tarballs into .pkg.tar.zst; `release` then creates the
# GitLab release, with CHANGELOG.md's section as its notes, linking all eight.
# The newest release's files are always at
#   https://gitlab.com/896kb/air-gestures/-/releases/permalink/latest/downloads/air-gestures-<arch>-linux.<ext>
#
# Built on Debian bookworm so the binaries only need glibc >= 2.36.

stages: [test, build, release]

# Every job runs on the homelab's docker runner (brigadahq-docker), not GitLab's
# metered shared runners.
default:
  tags: [docker]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: "always"
  TARGET: "x86_64-unknown-linux-gnu"

.rust:
  image: rust:1-bookworm
  before_script:
    - apt-get update -qq
    - >
      apt-get install -y -qq --no-install-recommends
      pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - rustc --version && cargo --version
  cache:
    key:
      files: [Cargo.lock]
      prefix: "$CI_JOB_NAME"
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/

test:
  extends: .rust
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
  script:
    - cargo test --workspace --locked

build:
  extends: .rust
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - cargo build --workspace --release --locked --target "$TARGET"

package:
  extends: .rust
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - sh .gitlab/package.sh "$TARGET" x86_64
  artifacts:
    paths: ["air-gestures-*-x86_64-linux.*"]

# aarch64: cross-built on the same x86_64 runner (Debian bookworm, so the same
# glibc >= 2.36 floor), in its own job so a failure is easy to spot.
.aarch64:
  image: debian:bookworm
  variables:
    PKG_CONFIG_ALLOW_CROSS: "1"
    PKG_CONFIG_LIBDIR: "/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: "aarch64-linux-gnu-gcc"
  before_script:
    - sh .gitlab/cross-aarch64.sh
    - . "$CARGO_HOME/env"
    - rustc --version && cargo --version
  cache:
    key:
      files: [Cargo.lock]
      prefix: "$CI_JOB_NAME"
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/

# Branch builds only when the dependencies or the build itself change.
build-aarch64:
  extends: .aarch64
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: [Cargo.lock, "**/Cargo.toml", .gitlab-ci.yml, .gitlab/*]
  script:
    - cargo build --workspace --release --locked --target aarch64-unknown-linux-gnu

package-aarch64:
  extends: .aarch64
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - sh .gitlab/package.sh aarch64-unknown-linux-gnu aarch64
  artifacts:
    paths: ["air-gestures-*-aarch64-linux.*"]

# The Arch packages: makepkg on packaging/aur's PKGBUILD, fed the tarballs above.
package-arch:
  stage: build
  image: archlinux:base-devel
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [package, package-aarch64]
  script:
    - sh .gitlab/package-arch.sh
  artifacts:
    paths: ["air-gestures-*-linux.pkg.tar.zst"]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [package, package-aarch64, package-arch]
  script:
    # The notes: this version's CHANGELOG.md section, then the install text.
    - sh .gitlab/release-notes.sh
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    # A file, so the backticks in it reach the release as they are.
    description: release-notes.md
    assets:
      links:
        - name: "air-gestures-$CI_COMMIT_TAG-x86_64-linux.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-x86_64-linux.tar.gz"
          link_type: package
          filepath: "/air-gestures-x86_64-linux.tar.gz"
        - name: "air-gestures-$CI_COMMIT_TAG-x86_64-linux.deb"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-x86_64-linux.deb"
          link_type: package
          filepath: "/air-gestures-x86_64-linux.deb"
        - name: "air-gestures-$CI_COMMIT_TAG-x86_64-linux.rpm"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-x86_64-linux.rpm"
          link_type: package
          filepath: "/air-gestures-x86_64-linux.rpm"
        - name: "air-gestures-$CI_COMMIT_TAG-x86_64-linux.pkg.tar.zst"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-x86_64-linux.pkg.tar.zst"
          link_type: package
          filepath: "/air-gestures-x86_64-linux.pkg.tar.zst"
        - name: "air-gestures-$CI_COMMIT_TAG-aarch64-linux.tar.gz"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-aarch64-linux.tar.gz"
          link_type: package
          filepath: "/air-gestures-aarch64-linux.tar.gz"
        - name: "air-gestures-$CI_COMMIT_TAG-aarch64-linux.deb"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-aarch64-linux.deb"
          link_type: package
          filepath: "/air-gestures-aarch64-linux.deb"
        - name: "air-gestures-$CI_COMMIT_TAG-aarch64-linux.rpm"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-aarch64-linux.rpm"
          link_type: package
          filepath: "/air-gestures-aarch64-linux.rpm"
        - name: "air-gestures-$CI_COMMIT_TAG-aarch64-linux.pkg.tar.zst"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/air-gestures/$CI_COMMIT_TAG/air-gestures-$CI_COMMIT_TAG-aarch64-linux.pkg.tar.zst"
          link_type: package
          filepath: "/air-gestures-aarch64-linux.pkg.tar.zst"
