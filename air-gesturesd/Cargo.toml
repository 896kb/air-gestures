[package]
name = "air-gesturesd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Meta Neural Band daemon: gestures to desktop actions over BlueZ"

[dependencies]
band-core = { path = "../band-core" }
base64 = "0.22"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
futures = "0.3"
p256 = { version = "0.13", features = ["ecdsa"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "process", "signal", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
rand_core = { version = "0.6", features = ["getrandom"] }
